apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
spec:
  containers:
  - name: crashloop-container
    image: busybox
    command: ["sh", "-c", "echo App started; sleep 2; exit 1"]

---
apiVersion: v1
kind: Pod
metadata:
  name: errimagepull-demo
spec:
  containers:
  - name: wrong-registry-container
    image: this-registry-does-not-exist.com/myapp:v1

---
apiVersion: v1
kind: Pod
metadata:
  name: imagepull-demo
spec:
  containers:
  - name: bad-tag-container
    image: nginx:not-a-real-tag

---
apiVersion: v1
kind: Pod
metadata:
  name: pending-demo
spec:
  containers:
  - name: high-resource-container
    image: nginx
    resources:
      requests:
        cpu: "100"
        memory: "500Gi"

---
apiVersion: v1
kind: Pod
metadata:
  name: oomkilled-demo
spec:
  containers:
  - name: memory-demo
    image: polinux/stress
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]
    resources:
      limits:
        memory: "100Mi"
      requests:
        memory: "50Mi"